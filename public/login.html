<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJETO EMAGRECIMENTO SAUDÁVEL – Acesso Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { background:linear-gradient(135deg,#1e3a8a,#3b82f6); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .caixa { background:white; padding:40px 30px; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.2); max-width:420px; width:100%; text-align:center; }
    h1 { color:#1e40af; font-size:22px; margin-bottom:8px; font-weight:800; }
    .subtitulo { color:#475569; font-size:15px; margin-bottom:20px; line-height:1.5; }
    .aviso { background:#f0f9ff; border-left:4px solid #0284c7; padding:12px; border-radius:8px; margin-bottom:20px; text-align:left; font-size:14px; color:#0c4a6e; }
    .campo { margin-bottom:15px; text-align:left; }
    label { display:block; margin-bottom:6px; color:#334155; font-weight:500; font-size:14px; }
    input { width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px; font-size:16px; }
    input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,0.15); }
    .btn { width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; transition:background 0.2s; margin-bottom:10px; }
    .btn-email { background:#2563eb; color:white; }
    .btn-email:hover { background:#1d4ed8; }
    .mensagem { margin-top:12px; font-size:14px; padding:10px; border-radius:6px; display:none; }
    .erro { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
    .sucesso { background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }
  </style>
</head>
<body>
<div class="caixa">
  <h1>PROJETO EMAGRECIMENTO SAUDÁVEL</h1>
  <div class="aviso" style="margin-top:15px;">
    <strong>Instruções de Acesso</strong><br>
    Digite sua senha ou PIN de acesso no campo abaixo.
  </div>

  <div class="campo">
    <label>E-mail de Acesso (Opcional)</label>
    <input type="email" id="emailCliente" placeholder="seuemail@exemplo.com" autocomplete="off">
  </div>
  <div class="campo">
    <label>Senha ou PIN</label>
    <input type="password" id="senhaCliente" placeholder="Sua senha de acesso" autocomplete="off">
  </div>
  <button id="btnEntrar" class="btn btn-email" onclick="fazerLogin()">Acessar Sistema</button>

  <div id="mensagem" class="mensagem"></div>
</div>

<script>
const SUPABASE_URL = "https://qnrtjzlhrvlpfcyrmfnq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFucnRqemxocnZscGZjeXJtZm5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NDkwMDEsImV4cCI6MjEwMTAyNTAwMX0.x3H_Gg78kyUxgG390VDSAoJ-xdFmIU910P7EW9MNqyY";
const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

function mostrarMensagem(texto, tipo = 'erro') {
  const el = document.getElementById('mensagem');
  if (el) {
    el.className = `mensagem ${tipo}`;
    el.textContent = texto;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 6000);
  }
}

// Verifica acesso ativo no carregamento e parâmetros de URL
window.addEventListener('DOMContentLoaded', () => {
  // Leitura de parâmetros da URL (ex: ?codigo=001&pin=1234)
  const urlParams = new URLSearchParams(window.location.search);
  const pinParam = urlParams.get('pin');
  const emailParam = urlParams.get('email');

  if (emailParam) {
    const elEmail = document.getElementById('emailCliente');
    if (elEmail) elEmail.value = emailParam;
  }

  if (pinParam) {
    const elSenha = document.getElementById('senhaCliente');
    if (elSenha) {
      elSenha.value = pinParam;
      fazerLogin();
      return;
    }
  }

  const rawOk = localStorage.getItem('acesso_ok');
  if (rawOk) {
    try {
      const parsed = JSON.parse(rawOk);
      if (parsed && (parsed.email || parsed.senha)) {
        mostrarMensagem('✅ Sessão Supabase ativa!', 'sucesso');
        setTimeout(() => { window.location.href = 'conteudo.html'; }, 800);
      }
    } catch (e) {
      // Ignora erro
    }
  }
});

// Função do botão de acesso
async function fazerLogin() {
  const email = document.getElementById('emailCliente').value.trim();
  const senha = document.getElementById('senhaCliente').value.trim();
  const btn = document.getElementById('btnEntrar');

  if (!senha) return alert('Digite a senha ou PIN de acesso!');

  if (btn) { btn.disabled = true; btn.textContent = 'Verificando no Supabase...'; }

  try {
    // 1. Verificação de senha Admin master
    if (senha === '12726658' || senha === '123456' || email === 'kauanma.1979@gmail.com') {
      const sessaoObj = { tipo: 'supabase_admin', email: email || 'admin@emagrecimento.com', senha: senha, timestamp: Date.now() };
      localStorage.setItem('acesso_ok', JSON.stringify(sessaoObj));
      localStorage.setItem('acesso_seguro_v2', JSON.stringify({
        inicio: Date.now(),
        validade: 0,
        dispositivo: 'ADMIN_LIVRE',
        senhaUsada: senha,
        senha: senha,
        liberado: 'sim'
      }));
      mostrarMensagem('✅ Acesso de Administrador Liberado!', 'sucesso');
      setTimeout(() => { window.location.href = 'conteudo.html'; }, 800);
      return;
    }

    // 2. Consulta no Banco de Dados Supabase (Tabela senhas_acesso)
    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from('senhas_acesso')
        .select('*')
        .eq('senha', senha)
        .maybeSingle();

      if (!error && data) {
        const validoAte = data.valido_ate ? (typeof data.valido_ate === 'number' ? data.valido_ate : new Date(data.valido_ate).getTime()) : null;
        if (validoAte && Date.now() > validoAte && data.tipo !== 'admin') {
          mostrarMensagem('⚠️ Essa senha/PIN expirou no Supabase! Solicite renovação.', 'erro');
          return;
        }

        const sessaoObj = { tipo: 'supabase', email: email || data.dados_cliente?.email || 'cliente@emagrecimento.com', senha: senha, timestamp: Date.now() };
        localStorage.setItem('acesso_ok', JSON.stringify(sessaoObj));
        localStorage.setItem('acesso_seguro_v2', JSON.stringify({
          inicio: Date.now(),
          validade: data.validade_ms || 86400000,
          dispositivo: 'SUPABASE_DEVICE',
          senhaUsada: senha,
          senha: senha,
          liberado: 'sim'
        }));

        mostrarMensagem('✅ Acesso liberado pelo Supabase!', 'sucesso');
        setTimeout(() => { window.location.href = 'conteudo.html'; }, 800);
        return;
      }
    }

    // 3. Verificação em lista de clientes locais (Fallback)
    const clientesLocais = JSON.parse(localStorage.getItem('admin_clientes_lista') || '[]');
    const achou = clientesLocais.find(c => (c.senha && c.senha === senha) || (c.email && c.email.toLowerCase() === email.toLowerCase()));

    if (achou) {
      if (achou.dataExpira && new Date() > new Date(achou.dataExpira)) {
        mostrarMensagem('⚠️ Acesso expirado! Entre em contato para renovação.', 'erro');
        return;
      }

      const sessaoObj = { tipo: 'local', email: email || achou.email, senha: senha, timestamp: Date.now() };
      localStorage.setItem('acesso_ok', JSON.stringify(sessaoObj));
      mostrarMensagem('✅ Acesso liberado!', 'sucesso');
      setTimeout(() => { window.location.href = 'conteudo.html'; }, 800);
      return;
    }

    mostrarMensagem('Senha/PIN inválido ou não encontrado no Supabase.', 'erro');

  } catch (e) {
    alert('Erro ao conectar: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Acessar Sistema'; }
  }
}
</script>
</body>
</html>
