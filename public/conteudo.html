<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Cliente</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { background:#f8fafc; padding:30px; max-width:900px; margin:0 auto; }
    .cabecalho { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
    h1 { color:#1e40af; }
    .btn-sair { padding:8px 16px; background:#dc2626; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
    .caixa { background:white; padding:25px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:20px; }
    .dados-usuario { color:#475569; margin-bottom:15px; line-height:1.8; }
    .btn-app { display:inline-block; margin-top:15px; background:#16a34a; color:white; padding:10px 20px; text-decoration:none; border-radius:8px; font-weight:bold; }
  </style>
</head>
<body>
<div class="cabecalho">
  <h1>👋 Área do Cliente – Emagrecimento Saudável</h1>
  <button class="btn-sair" onclick="sair()">Sair</button>
</div>

<div class="caixa">
  <div class="dados-usuario">
    <strong>Nome:</strong> <span id="nomeUsuario">Cliente</span><br>
    <strong>E-mail:</strong> <span id="emailUsuario">---</span><br>
    <strong>Validade até:</strong> <span id="validadeUsuario">---</span>
  </div>
  <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">
  <p style="margin-bottom:15px; font-size:15px; color:#334155;">
    Seja bem-vindo(a) ao seu painel exclusivo! Aqui você tem acesso ao aplicativo completo de controle de saúde, nutrição e rastreamento de progresso.
  </p>
  <a href="/" class="btn-app">🚀 Abrir Aplicativo Completo</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBv7Vg0-IYNmDX9SZY7wZYCZKLbQMaoDF8",
  authDomain: "oemagrecimentosaudavel.firebaseapp.com",
  projectId: "oemagrecimentosaudavel",
  storageBucket: "oemagrecimentosaudavel.firebasestorage.app",
  messagingSenderId: "902556499129",
  appId: "1:902556499129:web:736e2616dad2266f576f68"
};

let auth = null;
let db = null;

try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
} catch (e) {
  console.warn("Firebase note:", e);
}

if (auth) {
  auth.onAuthStateChanged(async usuario => {
    if (!usuario) {
      const ok = localStorage.getItem('acesso_ok');
      if (!ok) return window.location.href='login.html';
      return;
    }
    try {
      if (db) {
        const doc = await db.collection('usuarios').doc(usuario.uid).get();
        if (doc.exists) {
          const dados = doc.data();
          if (dados.data_expiracao) {
            const expira = dados.data_expiracao.toDate ? dados.data_expiracao.toDate() : new Date(dados.data_expiracao);
            if (new Date() > expira) return sair();
            document.getElementById('nomeUsuario').textContent = dados.nome || 'Cliente';
            document.getElementById('emailUsuario').textContent = dados.email || usuario.email;
            document.getElementById('validadeUsuario').textContent = expira.toLocaleDateString('pt-BR');
            return;
          }
        }
      }
      document.getElementById('emailUsuario').textContent = usuario.email;
    } catch { 
      document.getElementById('emailUsuario').textContent = usuario.email;
    }
  });
} else {
  const ok = localStorage.getItem('acesso_ok');
  if (!ok) window.location.href='login.html';
}

function sair() { 
  localStorage.removeItem('acesso_ok');
  if (auth) auth.signOut(); 
  window.location.href='login.html'; 
}
</script>
</body>
</html>
