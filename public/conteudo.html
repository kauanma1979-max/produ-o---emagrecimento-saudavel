<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Cliente – Emagrecimento Saudável</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { background:#f8fafc; padding:30px; max-width:900px; margin:0 auto; }
    .cabecalho { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
    h1 { color:#1e40af; }
    .btn-sair { padding:8px 16px; background:#dc2626; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
    .caixa { background:white; padding:25px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:20px; }
    .dados-usuario { color:#475569; margin-bottom:15px; line-height:1.8; }
    .btn-app { display:inline-block; margin-top:15px; background:#16a34a; color:white; padding:10px 20px; text-decoration:none; border-radius:8px; font-weight:bold; }
  </style>
</head>
<body>
<div class="cabecalho">
  <h1>👋 Área do Cliente – Emagrecimento Saudável</h1>
  <button class="btn-sair" onclick="sair()">Sair</button>
</div>

<div class="caixa">
  <div class="dados-usuario">
    <strong>Nome:</strong> <span id="nomeUsuario">Cliente</span><br>
    <strong>E-mail:</strong> <span id="emailUsuario">---</span><br>
    <strong>Status da Conta:</strong> <span id="validadeUsuario" style="color:#16a34a; font-weight:bold;">Acesso Liberado</span>
  </div>
  <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">
  <p style="margin-bottom:15px; font-size:15px; color:#334155;">
    Seja bem-vindo(a) ao seu painel exclusivo! Aqui você tem acesso ao aplicativo completo de controle de saúde, nutrição e rastreamento de progresso.
  </p>
  <a href="/" class="btn-app">🚀 Abrir Aplicativo Completo</a>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const rawOk = localStorage.getItem('acesso_ok');
  if (!rawOk) {
    window.location.href = 'login.html';
    return;
  }

  try {
    const parsed = JSON.parse(rawOk);
    if (parsed) {
      document.getElementById('emailUsuario').textContent = parsed.email || 'cliente@exemplo.com';
      document.getElementById('nomeUsuario').textContent = parsed.nome || (parsed.email ? parsed.email.split('@')[0] : 'Cliente');
    }
  } catch (e) {
    document.getElementById('emailUsuario').textContent = 'Sessão Ativa';
  }
});

function sair() {
  localStorage.removeItem('acesso_ok');
  localStorage.removeItem('acesso_seguro_v2');
  window.location.href = 'login.html';
}
</script>
</body>
</html>
